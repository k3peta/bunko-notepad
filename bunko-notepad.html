<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>bunko-notepad</title>
  <style>
    :root {
      --bg: #e7e3da;
      --bar: #f5f2eb;
      --paper: #fffdf8;
      --ink: #24211d;
      --muted: #6f6a61;
      --line: #d6d0c5;
      --accent: #315f7b;
      --app-height: 100dvh;
      --editor-scroll-offset: 0px;
      --chars: 40;
      --lines: 15;
      --page-padding: 28px;
      --ruler-height: 18px;
      --font-size: 22px;
      --char-pitch: 22px;
      --line-pitch: 38px;
      --font-ui: "Hiragino Sans", "Yu Gothic", "BIZ UDPGothic", sans-serif;
      --font-body: "Hiragino Mincho ProN", "Yu Mincho", "BIZ UDPMincho", serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-ui);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit;
    }

    button,
    input[type="text"],
    select {
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--paper);
      padding: 4px 9px;
    }

    button {
      cursor: pointer;
      white-space: nowrap;
      touch-action: manipulation;
    }

    button.primary {
      color: #fff;
      border-color: var(--accent);
      background: var(--accent);
    }

    .app {
      height: var(--app-height);
      display: flex;
      flex-direction: row;
      min-width: 0;
    }

    .field {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .field input[type="text"] {
      width: 132px;
      color: var(--ink);
    }

    .spacer {
      flex: 1 1 auto;
      min-width: 12px;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .work {
      flex: 1 1 auto;
      min-height: 0;
      padding: 28px 28px 28px 20px;
      overflow: hidden;
    }

    .paper {
      position: relative;
      width: min(100%, calc(var(--line-pitch) * var(--lines) * 2 + var(--page-padding) * 2));
      height: 100%;
      margin-left: auto;
      border: 1px solid #cfc7b9;
      background: var(--paper);
      box-shadow: 0 1px 2px rgba(36, 33, 29, 0.08);
      overflow: hidden;
    }

    .paper::before {
      content: "";
      position: absolute;
      left: var(--page-padding);
      right: var(--page-padding);
      top: calc(var(--page-padding) + var(--char-pitch));
      bottom: var(--page-padding);
      border: 1px solid rgba(70, 62, 50, 0.13);
      pointer-events: none;
      z-index: 2;
    }

    .paper.no-ruler::before {
      top: var(--page-padding);
    }

    .paper-guides {
      position: absolute;
      left: var(--page-padding);
      right: var(--page-padding);
      top: calc(var(--page-padding) + var(--char-pitch));
      bottom: var(--page-padding);
      pointer-events: none;
      z-index: 0;
    }

    .paper.no-ruler .paper-guides {
      top: var(--page-padding);
    }

    .paper.show-grid .paper-guides::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to left, rgba(70, 62, 50, 0.075) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(70, 62, 50, 0.055) 1px, transparent 1px);
      background-size:
        var(--line-pitch) 100%,
        100% var(--char-pitch);
      background-position:
        calc(100% + var(--editor-scroll-offset)) top,
        right top;
    }

    .paper.show-page-break .paper-guides::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: linear-gradient(
        to left,
        rgba(49, 95, 123, 0.22) 0,
        rgba(49, 95, 123, 0.22) 1px,
        transparent 1px
      );
      background-repeat: repeat-x;
      background-position: calc(100% + var(--editor-scroll-offset)) top;
      background-size: calc(var(--line-pitch) * var(--lines)) 100%;
    }

    .line-ruler {
      position: absolute;
      top: 4px;
      right: var(--page-padding);
      left: var(--page-padding);
      z-index: 4;
      height: var(--ruler-height);
      overflow: hidden;
      color: rgba(111, 106, 97, 0.78);
      font-size: 9px;
      line-height: 1;
      user-select: none;
    }

    .line-ruler[hidden] { display: none; }

    .line-ruler-track {
      position: relative;
      display: block;
      height: 100%;
      width: 100%;
    }

    .line-ruler span {
      position: absolute;
      top: 0;
      width: var(--line-pitch);
      text-align: center;
    }

    .line-ruler span.is-current {
      color: var(--accent);
      font-weight: 700;
    }

    #editor {
      position: relative;
      z-index: 3;
      width: calc(100% - var(--page-padding) * 2);
      height: calc(100% - var(--page-padding) * 2 - var(--char-pitch));
      margin: calc(var(--page-padding) + var(--char-pitch)) var(--page-padding) var(--page-padding);
      border: 0;
      outline: 0;
      overflow-x: auto;
      overflow-y: hidden;
      background: transparent;
      color: var(--ink);
      font-family: var(--font-body);
      font-size: var(--font-size);
      line-height: var(--line-pitch);
      letter-spacing: 0;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      white-space: pre-wrap;
      word-break: normal;
      line-break: strict;
      hanging-punctuation: allow-end;
      font-feature-settings: "palt" 0, "halt" 0, "vhal" 0;
      font-kerning: none;
      scrollbar-width: thin;
      resize: none;
      padding: 0;
    }


    .paper.no-ruler #editor {
      height: calc(100% - var(--page-padding) * 2);
      margin-top: var(--page-padding);
    }

    .side {
      flex: 0 0 300px;
      width: 300px;
      height: 100vh;
      width: 300px;
      border-right: 1px solid var(--line);
      background: var(--bar);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: auto;
    }

    .mobile-drawer-close,
    .mobile-scrim,
    .mobile-controls {
      display: none;
    }

    .side h2 {
      margin: 0;
      font-size: 16px;
    }

    .drawer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .search-history-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
    }

    .search-history-row label {
      min-width: 0;
    }

    .search-history-row select {
      min-width: 0;
    }

    .side .block {
      display: grid;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .side label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .side label.field {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      line-height: 1.45;
      min-height: 24px;
      color: var(--ink);
    }

    .side label.field input[type="checkbox"] {
      flex: 0 0 auto;
      width: 14px;
      height: 14px;
      margin: 0;
    }

    .side input[type="text"],
    .side select {
      width: 100%;
      color: var(--ink);
    }

    .outline-list {
      display: grid;
      gap: 6px;
      max-height: 220px;
      margin: 0;
      padding: 0;
      overflow: auto;
      list-style: none;
    }

    .outline-item {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 8px;
      align-items: center;
      padding: 7px 8px;
      border: 1px solid rgba(70, 62, 50, 0.12);
      border-radius: 4px;
      background: rgba(255, 253, 248, 0.74);
      cursor: grab;
    }

    .outline-item:hover,
    .outline-item:focus-visible {
      border-color: rgba(49, 95, 123, 0.3);
      background: var(--paper);
      outline: none;
    }

    .outline-item.dragging {
      opacity: 0.52;
    }

    .outline-index {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(49, 95, 123, 0.12);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
    }

    .outline-text {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .outline-title {
      overflow: hidden;
      color: var(--ink);
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .outline-meta,
    .empty-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    #fileInput { display: none; }

    .preview {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      background: rgba(36, 33, 29, 0.36);
    }

    .preview.is-open {
      display: block;
    }

    .preview-head {
      position: absolute;
      top: 0;
      right: 16px;
      z-index: 2;
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 0 0 5px 5px;
      background: var(--bar);
      box-shadow: 0 8px 24px rgba(36, 33, 29, 0.12);
      font-size: 75%;
    }

    .preview-head button {
      height: 24px;
      padding: 2px 7px;
    }

    .preview-body {
      height: 100vh;
      overflow: auto;
      padding: 8px 92px 12px 12px;
      background: var(--bg);
    }

    .preview-spread {
      width: max-content;
      margin: 0 auto 16px;
    }

    .preview-pages {
      display: grid;
      grid-template-columns: auto auto;
      gap: 24px;
      align-items: start;
    }

    .preview-page {
      padding: 28px;
      border: 1px solid #cfc7b9;
      background: var(--paper);
    }

    .preview-page-head {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .preview-viewport {
      width: calc(var(--line-pitch) * var(--lines));
      height: calc(var(--char-pitch) * (var(--chars) + 0.5));
      overflow: visible;
      position: relative;
      background: var(--paper);
    }

    .preview-manuscript {
      display: flex;
      flex-direction: row-reverse;
      align-items: flex-start;
      width: calc(var(--line-pitch) * var(--lines));
      height: calc(var(--char-pitch) * var(--chars));
      overflow: visible;
      font-family: var(--font-body);
      font-size: var(--font-size);
      line-height: 1;
      font-feature-settings: "palt" 0, "halt" 0, "vhal" 0;
      font-kerning: none;
    }

    .preview-line {
      position: relative;
      flex: 0 0 var(--line-pitch);
      height: calc(var(--char-pitch) * var(--chars));
      writing-mode: vertical-rl;
      text-orientation: mixed;
      white-space: nowrap;
      overflow: visible;
    }

    .preview-char,
    .preview-hanging {
      position: absolute;
      right: 50%;
      width: var(--char-pitch);
      height: var(--char-pitch);
      display: grid;
      place-items: center;
      transform: translateX(50%);
    }

    .preview-hanging {
      top: calc(var(--char-pitch) * var(--chars));
    }

    .preview-char.tcy {
      writing-mode: horizontal-tb;
      text-orientation: mixed;
      font-size: max(10px, calc(var(--font-size) * 0.78));
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .preview-char.heading {
      justify-items: end;
      font-size: calc(var(--font-size) * 1.5);
      line-height: 1;
    }

    .ruby-stack {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
    }

    .ruby-rb {
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }

    .ruby-rt {
      position: absolute;
      right: calc(var(--char-pitch) * -0.08);
      top: 0;
      height: calc(var(--char-pitch) * var(--ruby-span, 1));
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: max(8px, calc(var(--font-size) * 0.56));
      line-height: 1;
      color: var(--muted);
    }

    .ruby-rt-char {
      position: absolute;
      top: calc((var(--char-pitch) * (var(--ruby-span, 1) - 1)) * var(--ruby-pos, 0));
      left: 0;
      width: 1em;
      height: 1em;
      display: grid;
      place-items: center;
    }

    .emphasis-stack {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
    }

    .emphasis-dot {
      position: absolute;
      right: calc(var(--char-pitch) * -0.32 - 2px);
      top: 50%;
      width: 1em;
      height: 1em;
      display: grid;
      place-items: center;
      font-family: var(--font-body);
      font-size: max(7px, calc(var(--font-size) * 0.34));
      line-height: 1;
      transform: translateY(-50%);
    }

    @media (max-width: 980px) {
      :root {
        --page-padding: 12px;
        --line-pitch: 28px;
      }

      html,
      body {
        width: 100%;
        height: var(--app-height);
        min-height: 0;
        overscroll-behavior: none;
      }

      .app {
        width: 100%;
        height: 100%;
        min-height: 0;
      }

      .work {
        width: 100%;
        height: 100%;
        min-height: 0;
        padding: 0;
        overflow: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }

      .paper {
        width: 100%;
        min-width: 100%;
        height: 100%;
        min-height: max(
          100%,
          calc(var(--char-pitch) * var(--chars) + var(--char-pitch) + var(--page-padding) * 2)
        );
        margin: 0;
        border: 0;
        box-shadow: none;
      }

      .paper.no-ruler {
        min-height: max(
          100%,
          calc(var(--char-pitch) * var(--chars) + var(--page-padding) * 2)
        );
      }

      #editor {
        scrollbar-width: none;
      }

      #editor::-webkit-scrollbar {
        display: none;
      }

      .side {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 30;
        width: min(88vw, 340px);
        height: var(--app-height);
        padding:
          calc(14px + env(safe-area-inset-top))
          14px
          calc(76px + env(safe-area-inset-bottom));
        border-right: 1px solid var(--line);
        box-shadow: 16px 0 36px rgba(36, 33, 29, 0.22);
        transform: translateX(-105%);
        transition: transform 220ms ease;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }

      .side.is-open {
        transform: translateX(0);
      }

      .mobile-drawer-close {
        position: fixed;
        top: auto;
        left: calc(8px + env(safe-area-inset-left));
        bottom: calc(8px + env(safe-area-inset-bottom));
        z-index: 35;
        display: none;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(245, 242, 235, 0.96);
        box-shadow: 0 8px 24px rgba(36, 33, 29, 0.18);
        font-weight: 700;
      }

      body.settings-open .mobile-drawer-close {
        display: inline-flex;
      }

      .mobile-scrim {
        position: fixed;
        inset: 0;
        z-index: 25;
        width: 100%;
        height: 100%;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: rgba(36, 33, 29, 0.38);
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms ease;
      }

      body.settings-open .mobile-scrim {
        display: block;
        opacity: 1;
        pointer-events: auto;
      }

      .mobile-controls {
        position: fixed;
        left: calc(8px + env(safe-area-inset-left));
        bottom: calc(8px + env(safe-area-inset-bottom));
        z-index: 20;
        display: inline-flex;
        gap: 4px;
        padding: 4px;
        border: 1px solid rgba(70, 62, 50, 0.18);
        border-radius: 999px;
        background: rgba(245, 242, 235, 0.94);
        box-shadow: 0 8px 24px rgba(36, 33, 29, 0.18);
        backdrop-filter: blur(14px);
      }

      .mobile-controls button {
        min-height: 40px;
        padding: 7px 12px;
        border-radius: 999px;
        background: transparent;
        font-size: 14px;
        font-weight: 700;
      }

      .mobile-controls button.primary {
        color: #fff;
        background: var(--accent);
      }

      .mobile-status {
        display: inline-flex;
        align-items: center;
        padding: 0 7px;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .preview {
        z-index: 50;
        height: var(--app-height);
      }

      .preview-head {
        top: env(safe-area-inset-top);
        right: 8px;
        left: 8px;
        min-height: 44px;
        padding: 6px 8px;
        border-radius: 0 0 6px 6px;
      }

      .preview-head .status {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .preview-head button {
        min-height: 34px;
      }

      #closePreviewButton {
        position: fixed;
        left: calc(8px + env(safe-area-inset-left));
        bottom: calc(8px + env(safe-area-inset-bottom));
        z-index: 3;
        min-height: 40px;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(245, 242, 235, 0.96);
        box-shadow: 0 8px 24px rgba(36, 33, 29, 0.18);
        font-size: 14px;
        font-weight: 700;
      }

      .preview-body {
        height: var(--app-height);
        padding:
          calc(54px + env(safe-area-inset-top))
          max(8px, env(safe-area-inset-right))
          calc(68px + env(safe-area-inset-bottom))
          max(8px, env(safe-area-inset-left));
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }

      .preview-spread {
        margin-bottom: 12px;
      }

      .preview-pages {
        display: flex;
        flex-direction: column-reverse;
        gap: 12px;
      }

      .preview-page {
        padding: 12px;
      }

      .preview-page.empty {
        display: none;
      }

      button,
      input[type="text"],
      select {
        min-height: 40px;
        font-size: 16px;
      }
    }

    @media (max-width: 980px) and (orientation: landscape) {
      .preview-pages {
        display: grid;
        grid-template-columns: auto auto;
        gap: 12px;
      }

      .preview-page.empty {
        display: block;
      }
    }

    @media (max-width: 980px) and (prefers-reduced-motion: reduce) {
      .side,
      .mobile-scrim {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side" id="side">
      <h2>設定</h2>
      <div class="drawer-grid">
        <button id="newButton">新規</button>
        <button id="openButton">開く</button>
        <button class="primary" id="saveButton">保存</button>
        <button id="saveAsButton">別名保存</button>
        <button id="saveSjisButton">S_JIS書き出し</button>
      </div>
      <input id="fileInput" type="file" accept=".txt,.md,.text,text/plain">

      <div class="block">
        <label>ファイル名 <input id="fileNameInput" type="text" value="bunko-notepad.txt"></label>
        <label>一行文字数
          <select id="charsSelect">
            <option value="39">39</option>
            <option value="40" selected>40</option>
            <option value="41">41</option>
          </select>
        </label>
        <label>一頁行数
          <select id="linesSelect">
            <option value="15" selected>15</option>
            <option value="16">16</option>
          </select>
        </label>
        <label class="field"><input id="lineNumberToggle" type="checkbox" checked> 欄外に行番号を表示</label>
        <label class="field"><input id="pageBreakToggle" type="checkbox" checked> ページ区切り線を表示</label>
        <label class="field"><input id="gridToggle" type="checkbox" checked> 原稿用紙の薄い枡を表示</label>
        <span class="status" id="statusLabel">0字 / 現在1行 / 全1行</span>
      </div>

      <div class="block">
        <label>検索 <input id="searchInput" type="text"></label>
        <div class="drawer-grid">
          <button id="findNextButton">検索</button>
        </div>
        <label class="field"><input id="regexToggle" type="checkbox"> 検索語を正規表現として扱う</label>
        <label>置換 <input id="replaceInput" type="text"></label>
        <div class="drawer-grid">
          <button id="replaceNextButton">置換検索</button>
          <button id="replaceAllButton">全置換</button>
        </div>
        <div class="search-history-row">
          <label>履歴 <select id="searchHistorySelect" aria-label="検索履歴"></select></label>
          <button id="clearSearchHistoryButton" type="button">履歴を消去</button>
        </div>
      </div>

      <div class="block">
        <strong class="status">見出し</strong>
        <ul class="outline-list" id="outlineList"></ul>
        <div class="empty-note" id="outlineEmpty">半角の # と空白で始まる行を拾います。</div>
      </div>

      <div class="block">
        <button id="previewButton">プレビュー</button>
      </div>
    </aside>

    <button class="mobile-drawer-close" id="mobileDrawerCloseButton" type="button" aria-label="設定を閉じる">← 閉じる</button>
    <main class="work">
      <div class="paper">
        <div class="paper-guides" aria-hidden="true"></div>
        <div class="line-ruler" id="lineRuler" aria-hidden="true">
          <div class="line-ruler-track" id="lineRulerTrack"></div>
        </div>
        <textarea id="editor" spellcheck="false" placeholder="ここへ入力"></textarea>
      </div>
    </main>

    <button class="mobile-scrim" id="mobileScrim" type="button" aria-label="設定を閉じる"></button>
    <nav class="mobile-controls" aria-label="モバイル操作">
      <span class="mobile-status" id="mobileStatus" aria-live="polite">現在1 / 全1行</span>
      <button id="mobileSettingsButton" type="button" aria-controls="side" aria-expanded="false">設定</button>
      <button class="primary" id="mobilePreviewButton" type="button">プレビュー</button>
    </nav>
  </div>

  <section class="preview" id="preview">
    <div class="preview-head">
      <strong>プレビュー</strong>
      <span class="status" id="previewStatus"></span>
      <div class="spacer"></div>
      <button id="closePreviewButton">← 閉じる</button>
    </div>
    <div class="preview-body" id="previewBody"></div>
  </section>

  <script>
    (() => {
      const STORAGE_KEY = 'bunko-simple-draft';
      const HISTORY_MAX_ENTRIES = 500;
      const HISTORY_MAX_TEXT_UNITS = 8_000_000;
      const SEARCH_HISTORY_MAX_ENTRIES = 20;
      const SEARCH_HISTORY_MAX_FIELD_LENGTH = 500;
      const mobileLayoutQuery = window.matchMedia('(max-width: 980px)');
      const graphemeSegmenter = typeof Intl !== 'undefined' && typeof Intl.Segmenter === 'function'
        ? new Intl.Segmenter('ja', { granularity: 'grapheme' })
        : null;
      const editor = document.getElementById('editor');
      const work = document.querySelector('.work');
      const paper = document.querySelector('.paper');
      const side = document.getElementById('side');
      const preview = document.getElementById('preview');
      const previewBody = document.getElementById('previewBody');
      const previewStatus = document.getElementById('previewStatus');
      const statusLabel = document.getElementById('statusLabel');
      const mobileStatus = document.getElementById('mobileStatus');
      const fileInput = document.getElementById('fileInput');
      const fileNameInput = document.getElementById('fileNameInput');
      const charsSelect = document.getElementById('charsSelect');
      const linesSelect = document.getElementById('linesSelect');
      const lineNumberToggle = document.getElementById('lineNumberToggle');
      const pageBreakToggle = document.getElementById('pageBreakToggle');
      const gridToggle = document.getElementById('gridToggle');
      const lineRuler = document.getElementById('lineRuler');
      const lineRulerTrack = document.getElementById('lineRulerTrack');
      const outlineList = document.getElementById('outlineList');
      const outlineEmpty = document.getElementById('outlineEmpty');
      const searchInput = document.getElementById('searchInput');
      const replaceInput = document.getElementById('replaceInput');
      const regexToggle = document.getElementById('regexToggle');
      const searchHistorySelect = document.getElementById('searchHistorySelect');
      const clearSearchHistoryButton = document.getElementById('clearSearchHistoryButton');
      const mobileDrawerCloseButton = document.getElementById('mobileDrawerCloseButton');
      const mobileScrim = document.getElementById('mobileScrim');
      const mobileSettingsButton = document.getElementById('mobileSettingsButton');
      const mobilePreviewButton = document.getElementById('mobilePreviewButton');
      let shiftJisEncodeMap = null;

      const state = {
        fileName: 'bunko-notepad.txt',
        fileHandle: null,
        chars: 40,
        lines: 15,
        showLineNumbers: true,
        showPageBreak: true,
        showGrid: true,
        searchHistory: [],
        outlineItems: [],
        dirty: false
      };
      let history = [];
      let historyIndex = -1;
      let restoringHistory = false;
      let autosaveFailed = false;
      let lastSearchMatch = null;
      let viewportResizeFrame = null;
      let editorIsComposing = false;

      const sampleText = [
        '# 使い方',
        '',
        'この軽量版は、縦書きのまま直接入力できることを優先した原稿エディタです。',
        'ページ風の固定面に入力しながら、必要に応じて正確な組版プレビューを確認できます。',
        '',
        '# 入力',
        '',
        '通常の本文はそのまま入力します。句読点の厳密なぶら下げはプレビューで確認します。',
        '',
        '# ファイル',
        '',
        'txt の読み込み、保存、名前を付けて保存に対応します。'
      ].join('\n');

      function normalize(text) {
        return String(text).replace(/\r\n?/g, '\n');
      }

      function sanitizeSearchHistory(value) {
        if (!Array.isArray(value)) return [];
        const sanitized = [];
        const seen = new Set();
        const inspectionLimit = Math.min(value.length, SEARCH_HISTORY_MAX_ENTRIES * 5);
        for (let index = 0; index < inspectionLimit; index += 1) {
          const item = value[index];
          if (sanitized.length >= SEARCH_HISTORY_MAX_ENTRIES) break;
          if (!item || typeof item !== 'object' || Array.isArray(item)) continue;
          if (
            typeof item.search !== 'string'
            || typeof item.replace !== 'string'
            || typeof item.regex !== 'boolean'
            || item.search === ''
            || item.search.length > SEARCH_HISTORY_MAX_FIELD_LENGTH
            || item.replace.length > SEARCH_HISTORY_MAX_FIELD_LENGTH
          ) continue;
          const entry = {
            search: item.search,
            replace: item.replace,
            regex: item.regex
          };
          const key = JSON.stringify([entry.search, entry.replace, entry.regex]);
          if (seen.has(key)) continue;
          seen.add(key);
          sanitized.push(entry);
        }
        return sanitized;
      }

      function summarizeHistoryText(value, maxLength = 34) {
        const characters = Array.from(value.replace(/\s/g, ' '));
        return characters.length <= maxLength
          ? characters.join('')
          : `${characters.slice(0, maxLength).join('')}…`;
      }

      function renderSearchHistory() {
        searchHistorySelect.replaceChildren();
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = state.searchHistory.length ? '履歴から復元' : '履歴なし';
        searchHistorySelect.appendChild(placeholder);
        state.searchHistory.forEach((entry, index) => {
          const option = document.createElement('option');
          const searchLabel = summarizeHistoryText(entry.search);
          const replaceLabel = entry.replace === ''
            ? '（空）'
            : summarizeHistoryText(entry.replace, 24);
          option.value = String(index);
          option.textContent = `${entry.regex ? '正規表現' : '文字列'}: ${searchLabel} → ${replaceLabel}`;
          searchHistorySelect.appendChild(option);
        });
        searchHistorySelect.value = '';
        searchHistorySelect.disabled = state.searchHistory.length === 0;
        clearSearchHistoryButton.disabled = state.searchHistory.length === 0;
      }

      function escapeHtml(text) {
        return text.replace(/[&<>"]/g, ch => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;'
        }[ch]));
      }

      function getText() {
        return normalize(editor.value);
      }

      function setText(text) {
        editor.value = normalize(text);
      }

      function snapshot() {
        return {
          text: getText(),
          start: editor.selectionStart || 0,
          end: editor.selectionEnd || 0
        };
      }

      function pushHistory() {
        if (restoringHistory) return;
        const next = snapshot();
        const current = history[historyIndex];
        if (current && current.text === next.text && current.start === next.start && current.end === next.end) return;
        history = history.slice(0, historyIndex + 1);
        history.push(next);
        historyIndex = history.length - 1;
        trimHistory();
      }

      function trimHistory() {
        let textUnits = history.reduce((total, entry) => total + entry.text.length, 0);
        while (
          history.length > 1
          && (history.length > HISTORY_MAX_ENTRIES || textUnits > HISTORY_MAX_TEXT_UNITS)
        ) {
          textUnits -= history[0].text.length;
          history.shift();
          historyIndex -= 1;
        }
      }

      function resetHistory() {
        history = [snapshot()];
        historyIndex = 0;
      }

      function restoreSnapshot(entry) {
        if (!entry) return;
        restoringHistory = true;
        setText(entry.text);
        const start = Math.max(0, Math.min(entry.start, editor.value.length));
        const end = Math.max(start, Math.min(entry.end, editor.value.length));
        editor.setSelectionRange(start, end);
        restoringHistory = false;
        state.dirty = true;
        updateStatus();
        renderLineRuler();
        renderOutline();
      }

      function undoEdit() {
        if (historyIndex <= 0) return;
        historyIndex -= 1;
        restoreSnapshot(history[historyIndex]);
      }

      function redoEdit() {
        if (historyIndex >= history.length - 1) return;
        historyIndex += 1;
        restoreSnapshot(history[historyIndex]);
      }

      function applySettings() {
        const paper = document.querySelector('.paper');
        const rootStyle = getComputedStyle(document.documentElement);
        const pagePadding = parseFloat(rootStyle.getPropertyValue('--page-padding')) || 28;
        const reservedRows = state.showLineNumbers ? 1 : 0;
        const layoutHeight = mobileLayoutQuery.matches ? work.clientHeight : paper.clientHeight;
        const available = Math.max(240, layoutHeight - pagePadding * 2);
        const minimumPitch = mobileLayoutQuery.matches ? 17 : 6;
        const charPitch = Math.max(minimumPitch, available / (state.chars + reservedRows));
        const fontSize = Math.max(minimumPitch, charPitch);
        document.documentElement.style.setProperty('--chars', state.chars);
        document.documentElement.style.setProperty('--lines', state.lines);
        document.documentElement.style.setProperty('--char-pitch', `${charPitch}px`);
        document.documentElement.style.setProperty('--font-size', `${fontSize}px`);
        charsSelect.value = String(state.chars);
        linesSelect.value = String(state.lines);
        lineNumberToggle.checked = state.showLineNumbers;
        pageBreakToggle.checked = state.showPageBreak;
        gridToggle.checked = state.showGrid;
        lineRuler.hidden = !state.showLineNumbers;
        paper.classList.toggle('no-ruler', !state.showLineNumbers);
        paper.classList.toggle('show-page-break', state.showPageBreak);
        paper.classList.toggle('show-grid', state.showGrid);
        fileNameInput.value = state.fileName;
        document.title = state.fileName.replace(/\.txt$/i, '') + ' - bunko-notepad';
        renderLineRuler();
        renderOutline();
      }

      function syncViewportHeight() {
        const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        document.documentElement.style.setProperty('--app-height', `${Math.round(viewportHeight)}px`);
      }

      function isMobileLayout() {
        return mobileLayoutQuery.matches;
      }

      function setMobileSettingsOpen(isOpen, restoreFocus = false) {
        if (!isMobileLayout()) {
          side.classList.remove('is-open');
          side.inert = false;
          return;
        }
        document.body.classList.toggle('settings-open', isOpen);
        side.classList.toggle('is-open', isOpen);
        side.inert = !isOpen;
        mobileSettingsButton.setAttribute('aria-expanded', String(isOpen));
        if (isOpen) {
          mobileDrawerCloseButton.focus({ preventScroll: true });
        } else if (restoreFocus) {
          mobileSettingsButton.focus({ preventScroll: true });
        }
      }

      function syncMobileLayoutState() {
        syncViewportHeight();
        if (isMobileLayout()) {
          const isOpen = document.body.classList.contains('settings-open');
          side.inert = !isOpen;
          side.classList.toggle('is-open', isOpen);
          mobileSettingsButton.setAttribute('aria-expanded', String(isOpen));
        } else {
          document.body.classList.remove('settings-open');
          side.classList.remove('is-open');
          side.inert = false;
          mobileSettingsButton.setAttribute('aria-expanded', 'false');
        }
        applySettings();
        updateStatus();
      }

      function handleViewportResize() {
        if (viewportResizeFrame !== null) cancelAnimationFrame(viewportResizeFrame);
        viewportResizeFrame = requestAnimationFrame(() => {
          viewportResizeFrame = null;
          syncViewportHeight();
          applySettings();
          updateStatus();
        });
      }

      function findCurrentLayoutLine(lines, caret = editor.selectionStart || 0) {
        let currentLine = lines.findIndex((line) => {
          if (line.start === line.end) return caret === line.start;
          return caret >= line.start && caret < line.end;
        });
        if (currentLine < 0) currentLine = Math.max(0, lines.length - 1);
        return currentLine;
      }

      function getEditorScrollOffset() {
        const maxScroll = Math.max(0, editor.scrollWidth - editor.clientWidth);
        return Math.min(maxScroll, Math.abs(editor.scrollLeft));
      }

      function renderStatusText(text, lines, currentLine) {
        const warning = autosaveFailed ? ' / 自動保存不可' : '';
        statusLabel.textContent = `${Array.from(text).length}字 / 現在${currentLine + 1}行 / 全${lines.length}行${warning}`;
        mobileStatus.textContent = `現在${currentLine + 1} / 全${lines.length}行`;
      }

      function renderLineRuler() {
        const text = getText();
        const lines = layoutLines(text);
        const currentLine = findCurrentLayoutLine(lines);
        const scrollOffset = getEditorScrollOffset();
        const linePitch = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--line-pitch')) || 28;
        const firstVisibleLine = Math.max(0, Math.floor(scrollOffset / linePitch) - 1);
        const visibleLineCount = Math.ceil(editor.clientWidth / linePitch) + 3;
        const lastVisibleLine = Math.min(
          Math.max(lines.length, state.lines * 2) - 1,
          firstVisibleLine + visibleLineCount
        );

        paper.style.setProperty('--editor-scroll-offset', `${scrollOffset}px`);
        lineRulerTrack.innerHTML = Array.from(
          { length: Math.max(0, lastVisibleLine - firstVisibleLine + 1) },
          (_item, index) => {
            const lineIndex = firstVisibleLine + index;
            const className = lineIndex === currentLine ? ' class="is-current"' : '';
            const right = lineIndex * linePitch - scrollOffset;
            return `<span${className} style="right:${right}px">${lineIndex + 1}</span>`;
          }
        ).join('');
        renderStatusText(text, lines, currentLine);
      }

      function extractHeadings(text) {
        const headings = [];
        const lines = normalize(text).split('\n');
        let offset = 0;
        lines.forEach((line, index) => {
          const match = line.match(/^(#{1,3})\s+(.+?)\s*$/);
          if (match) {
            headings.push({
              start: offset,
              end: offset + line.length,
              lineNumber: index + 1,
              level: match[1].length,
              title: match[2]
            });
          }
          offset += line.length + 1;
        });
        return headings;
      }

      function chooseReorderableHeadings(headings) {
        return headings;
      }

      function renderOutline() {
        const headings = chooseReorderableHeadings(extractHeadings(getText()));
        state.outlineItems = headings;
        outlineList.innerHTML = '';
        outlineEmpty.hidden = headings.length > 0;
        headings.forEach((heading, index) => {
          const item = document.createElement('li');
          item.className = 'outline-item';
          item.draggable = true;
          item.tabIndex = 0;
          item.dataset.index = String(index);
          item.innerHTML = `
            <span class="outline-index">${index + 1}</span>
            <span class="outline-text">
              <span class="outline-title">${escapeHtml(heading.title)}</span>
              <span class="outline-meta">${heading.lineNumber}行目 / H${heading.level}</span>
            </span>
          `;
          item.addEventListener('click', () => focusEditorRange(heading.start, heading.end));
          item.addEventListener('dragstart', handleOutlineDragStart);
          item.addEventListener('dragend', handleOutlineDragEnd);
          item.addEventListener('dragover', handleOutlineDragOver);
          item.addEventListener('drop', handleOutlineDrop);
          outlineList.appendChild(item);
        });
      }

      function focusEditorRange(start, end) {
        editor.focus();
        editor.setSelectionRange(start, end);
      }

      function handleOutlineDragStart(event) {
        event.currentTarget.classList.add('dragging');
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', event.currentTarget.dataset.index);
      }

      function handleOutlineDragEnd(event) {
        event.currentTarget.classList.remove('dragging');
      }

      function handleOutlineDragOver(event) {
        event.preventDefault();
        event.dataTransfer.dropEffect = 'move';
      }

      function handleOutlineDrop(event) {
        event.preventDefault();
        const fromIndex = Number(event.dataTransfer.getData('text/plain'));
        const toIndex = Number(event.currentTarget.dataset.index);
        reorderOutlineSections(fromIndex, toIndex);
      }

      function reorderOutlineSections(fromIndex, toIndex) {
        const headings = state.outlineItems;
        if (!Number.isInteger(fromIndex) || !Number.isInteger(toIndex) || fromIndex === toIndex) return;
        if (fromIndex < 0 || toIndex < 0 || fromIndex >= headings.length || toIndex >= headings.length) return;
        const text = getText();
        const prefix = text.slice(0, headings[0].start);
        const sections = headings.map((heading, index) => {
          const nextStart = index + 1 < headings.length ? headings[index + 1].start : text.length;
          return text.slice(heading.start, nextStart);
        });
        const moved = sections.splice(fromIndex, 1)[0];
        sections.splice(toIndex, 0, moved);
        setText(prefix + joinSections(sections));
        const reorderedHeadings = extractHeadings(getText());
        const movedHeading = reorderedHeadings[toIndex];
        const caret = movedHeading ? movedHeading.start : 0;
        editor.setSelectionRange(caret, caret);
        commitProgrammaticEdit();
      }

      function joinSections(sections) {
        return sections.reduce((output, section) => {
          if (!output) return section;
          return output.endsWith('\n') || section.startsWith('\n') ? output + section : `${output}\n${section}`;
        }, '');
      }

      function tokenizeForPreview(text) {
        const units = parseRubyUnits(normalize(text));
        const tokens = [];
        for (let index = 0; index < units.length; index += 1) {
          const unit = units[index];
          if (unit.type === 'newline') {
            tokens.push(unit);
            continue;
          }
          const tcyLength = detectTcyLength(units, index);
          if (tcyLength > 0) {
            const chunk = units.slice(index, index + tcyLength);
            tokens.push({
              type: 'char',
              text: chunk.map(item => item.text).join(''),
              tcy: true,
              headingLevel: chunk[0].headingLevel || 0,
              start: chunk[0].start,
              end: chunk[chunk.length - 1].end
            });
            index += tcyLength - 1;
            continue;
          }
          tokens.push(unit);
        }
        return tokens;
      }

      function parseRubyUnits(text) {
        const units = [];
        let atLineStart = true;
        let headingLevel = 0;
        for (let index = 0; index < text.length;) {
          const char = text[index];
          if (atLineStart) {
            const match = text.slice(index).match(/^(#{1,3}) (?=.)/);
            if (match) {
              headingLevel = match[1].length;
              index += match[0].length;
              atLineStart = false;
              continue;
            }
            headingLevel = 0;
          }
          if (char === '\n') {
            units.push({ type: 'newline', text: '\n', start: index, end: index + 1 });
            index += 1;
            atLineStart = true;
            headingLevel = 0;
            continue;
          }
          if (text.startsWith('《《', index)) {
            const emphasisEnd = text.indexOf('》》', index + 2);
            const lineBreak = text.indexOf('\n', index + 2);
            if (emphasisEnd !== -1 && (lineBreak === -1 || emphasisEnd < lineBreak)) {
              const baseText = text.slice(index + 2, emphasisEnd);
              if (baseText) {
                appendEmphasisUnits(units, baseText, index + 2, headingLevel);
                index = emphasisEnd + 2;
                atLineStart = false;
                continue;
              }
            }
          }
          if (char === '｜' || char === '|') {
            const rubyStart = text.indexOf('《', index + 1);
            const lineBreak = text.indexOf('\n', index + 1);
            if (rubyStart !== -1 && (lineBreak === -1 || rubyStart < lineBreak)) {
              const rubyEnd = text.indexOf('》', rubyStart + 1);
              if (rubyEnd !== -1 && (lineBreak === -1 || rubyEnd < lineBreak)) {
                const baseText = text.slice(index + 1, rubyStart);
                const rubyText = text.slice(rubyStart + 1, rubyEnd);
                if (baseText && rubyText) {
                  appendRubyUnits(units, baseText, rubyText, index + 1, headingLevel);
                  index = rubyEnd + 1;
                  atLineStart = false;
                  continue;
                }
              }
            }
          }
          if (char === '《') {
            const lineBreak = text.indexOf('\n', index + 1);
            const rubyEnd = text.indexOf('》', index + 1);
            if (rubyEnd !== -1 && (lineBreak === -1 || rubyEnd < lineBreak)) {
              const rubyText = text.slice(index + 1, rubyEnd);
              const baseUnits = popTrailingKanjiUnits(units);
              if (rubyText && baseUnits.length) {
                attachRuby(baseUnits, rubyText);
                units.push(...baseUnits);
                index = rubyEnd + 1;
                atLineStart = false;
                continue;
              }
            }
          }
          const codePoint = text.codePointAt(index);
          const value = String.fromCodePoint(codePoint);
          units.push({ type: 'char', text: value, start: index, end: index + value.length, headingLevel });
          index += value.length;
          atLineStart = false;
        }
        return units;
      }

      function appendEmphasisUnits(units, baseText, sourceStart, headingLevel = 0) {
        for (const { text, start, end } of iterateChars(baseText, sourceStart)) {
          units.push({ type: 'char', text, start, end, emphasis: true, headingLevel });
        }
      }

      function appendRubyUnits(units, baseText, rubyText, sourceStart, headingLevel = 0) {
        const rubyUnits = Array.from(iterateChars(baseText, sourceStart)).map(({ text, start, end }) => ({
          type: 'char',
          text,
          start,
          end,
          headingLevel
        }));
        attachRuby(rubyUnits, rubyText);
        units.push(...rubyUnits);
      }

      function* iterateChars(text, sourceStart) {
        let offset = 0;
        for (const char of Array.from(text)) {
          yield {
            text: char,
            start: sourceStart + offset,
            end: sourceStart + offset + char.length
          };
          offset += char.length;
        }
      }

      function attachRuby(units, rubyText) {
        if (!units.length) return;
        units[0].rubyText = rubyText;
        units[0].rubySpan = units.length;
      }

      function popTrailingKanjiUnits(units) {
        const popped = [];
        while (units.length) {
          const last = units[units.length - 1];
          if (popped.length >= 2 || last.type !== 'char' || last.rubyText || !/[\p{Script=Han}々〆ヵヶ]/u.test(last.text)) break;
          popped.unshift(units.pop());
        }
        return popped;
      }

      function detectTcyLength(units, index) {
        const current = units[index];
        if (!current || current.type !== 'char' || current.rubyText || current.emphasis) return 0;
        const prev = units[index - 1] || null;
        const next2 = units.slice(index, index + 2);
        const next3 = units.slice(index, index + 3);
        const after2 = units[index + 2] || null;
        const after3 = units[index + 3] || null;
        if (
          next3.length === 3
          && next3.every(unit => unit.type === 'char' && !unit.rubyText && !unit.emphasis)
          && /^[A-Za-z0-9.]{3}$/.test(next3.map(unit => unit.text).join(''))
          && next3.some(unit => unit.text === '.')
          && !isAsciiDotUnit(prev)
          && !isAsciiDotUnit(after3)
        ) return 3;
        if (
          next2.length === 2
          && next2.every(unit => unit.type === 'char' && !unit.rubyText && !unit.emphasis)
          && /^(?:[A-Za-z0-9]{2}|!\?|!!)$/.test(next2.map(unit => unit.text).join(''))
          && !isCompactTcyBoundaryUnit(prev)
          && !isCompactTcyBoundaryUnit(after2)
        ) return 2;
        return 0;
      }

      function isCompactTcyBoundaryUnit(unit) {
        return Boolean(unit && unit.type === 'char' && /^[A-Za-z0-9!?]$/.test(unit.text));
      }

      function isAsciiDotUnit(unit) {
        return Boolean(unit && unit.type === 'char' && /^[A-Za-z0-9.]$/.test(unit.text));
      }

      function isHangingPunctuation(token) {
        return Boolean(token && token.type === 'char' && /^[、。！？!?）」』】〕〉》〙〗〟’”]$/.test(token.text));
      }

      function tokenAdvance(token) {
        return token && token.headingLevel ? 1.5 : 1;
      }

      function layoutLines(text) {
        const tokens = tokenizeForPreview(text);
        const lines = [];
        let line = [];
        let lineAdvance = 0;
        let start = 0;
        let skipNewlineAt = -1;
        let ignoredTrailingNewline = false;
        tokens.forEach((token) => {
          if (token.type === 'newline') {
            if (!line.length && token.start === skipNewlineAt) {
              start = token.end;
              skipNewlineAt = -1;
              ignoredTrailingNewline = true;
              return;
            }
            lines.push({ cells: line, hanging: '', start, end: token.start });
            line = [];
            lineAdvance = 0;
            start = token.end;
            skipNewlineAt = -1;
            ignoredTrailingNewline = false;
            return;
          }
          const advance = tokenAdvance(token);
          if (line.length && lineAdvance + advance > state.chars) {
            if (isHangingPunctuation(token) && lineAdvance >= state.chars && !line.hanging) {
              line.hanging = token;
              lines.push({ cells: line, hanging: token, start, end: token.end });
              line = [];
              lineAdvance = 0;
              start = token.end;
              skipNewlineAt = token.end;
              return;
            }
            lines.push({ cells: line, hanging: '', start, end: token.start });
            line = [];
            lineAdvance = 0;
            start = token.start;
            skipNewlineAt = -1;
          }
          line.push(token);
          lineAdvance += advance;
          skipNewlineAt = -1;
          ignoredTrailingNewline = false;
        });
        if (line.length || (text.endsWith('\n') && !ignoredTrailingNewline)) {
          lines.push({ cells: line, hanging: '', start, end: tokens.length ? tokens[tokens.length - 1].end : 0 });
        }
        return lines.length ? lines : [{ cells: [], hanging: '', start: 0, end: 0 }];
      }

      function renderRubyText(token) {
        const chars = Array.from(token.rubyText || '');
        const denominator = Math.max(1, chars.length - 1);
        return chars.map((char, index) => {
          const pos = chars.length <= 1 ? 0.5 : index / denominator;
          return `<span class="ruby-rt-char" style="--ruby-pos:${pos}">${escapeHtml(char)}</span>`;
        }).join('');
      }

      function saveLocalState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            text: getText(),
            fileName: state.fileName,
            chars: state.chars,
            lines: state.lines,
            showLineNumbers: state.showLineNumbers,
            showPageBreak: state.showPageBreak,
            showGrid: state.showGrid,
            searchHistory: state.searchHistory
          }));
          autosaveFailed = false;
        } catch (_error) {
          autosaveFailed = true;
        }
      }

      function updateStatus() {
        const text = getText();
        const lines = layoutLines(text);
        saveLocalState();
        renderStatusText(text, lines, findCurrentLayoutLine(lines));
      }

      function renderPreviewLine(line) {
        let offset = 0;
        const cells = line.cells.map((token) => {
          const classes = ['preview-char'];
          if (token.tcy) classes.push('tcy');
          if (token.headingLevel) classes.push('heading');
          const content = token.rubyText
            ? `<span class="ruby-stack" style="--ruby-span:${token.rubySpan || 1}"><span class="ruby-rt">${renderRubyText(token)}</span><span class="ruby-rb">${escapeHtml(token.text)}</span></span>`
            : token.emphasis
              ? `<span class="emphasis-stack"><span class="emphasis-dot" aria-hidden="true">﹅</span><span>${escapeHtml(token.text)}</span></span>`
            : escapeHtml(token.text);
          const top = offset;
          offset += tokenAdvance(token);
          return `<span class="${classes.join(' ')}" style="top: calc(var(--char-pitch) * ${top})">${content}</span>`;
        }).join('');
        const hanging = line.hanging
          ? `<span class="preview-hanging">${escapeHtml(line.hanging.text)}</span>`
          : '';
        return `<div class="preview-line">${cells}${hanging}</div>`;
      }

      function renderPreview() {
        if (isMobileLayout()) setMobileSettingsOpen(false);
        const text = getText();
        const lines = layoutLines(text);
        const pages = [];
        for (let index = 0; index < lines.length; index += state.lines) {
          pages.push(lines.slice(index, index + state.lines));
        }
        if (!pages.length) pages.push([]);
        const spreads = [];
        for (let index = 0; index < pages.length; index += 2) {
          spreads.push([pages[index + 1] || null, pages[index] || null]);
        }
        previewBody.innerHTML = spreads.map((spread, spreadIndex) => {
          const pageOffset = spreadIndex * 2;
          const pageHtml = spread.map((pageLines, sideIndex) => {
            if (!pageLines) return '<article class="preview-page empty"><div class="preview-page-head"><span>空白</span></div><div class="preview-viewport"><div class="preview-manuscript"></div></div></article>';
            const pageNumber = pageOffset + (sideIndex === 0 ? 2 : 1);
            const body = pageLines.map(renderPreviewLine).join('');
            return `
              <article class="preview-page">
                <div class="preview-page-head"><span>P.${pageNumber}</span><span>${pageLines.length}/${state.lines}行</span></div>
                <div class="preview-viewport">
                  <div class="preview-manuscript">${body}</div>
                </div>
              </article>
            `;
          }).join('');
          return `
            <section class="preview-spread">
              <div class="preview-pages">${pageHtml}</div>
            </section>
          `;
        }).join('');
        previewStatus.textContent = `見開き 1/${spreads.length}　総 ${pages.length}頁 / ${lines.length}行`;
        preview.classList.add('is-open');
        if (isMobileLayout()) {
          requestAnimationFrame(() => {
            previewBody.scrollTop = 0;
            previewBody.scrollLeft = Math.max(0, previewBody.scrollWidth - previewBody.clientWidth);
          });
        }
      }

      function closePreview() {
        preview.classList.remove('is-open');
        editor.focus();
      }

      function markDirty() {
        state.dirty = true;
        updateStatus();
      }

      function isAbortError(error) {
        return Boolean(error && error.name === 'AbortError');
      }

      async function openDocument() {
        if (state.dirty && !confirm('未保存の変更があります。別の原稿を開きますか？')) return;
        fileInput.click();
      }

      async function readTextFile(file) {
        if (!window.TextDecoder) return normalize(await file.text());
        const bytes = new Uint8Array(await file.arrayBuffer());
        try {
          return normalize(new TextDecoder('utf-8', { fatal: true }).decode(bytes));
        } catch (_utf8Error) {
          return normalize(new TextDecoder('shift_jis', { fatal: true }).decode(bytes));
        }
      }

      async function saveDocument(saveAs = false) {
        try {
          const text = getText();
          if (!saveAs && state.fileHandle?.createWritable) {
            const writable = await state.fileHandle.createWritable();
            await writable.write(text);
            await writable.close();
            state.dirty = false;
            updateStatus();
            return;
          }
          if (window.showSaveFilePicker) {
            const handle = await window.showSaveFilePicker({
              suggestedName: state.fileName,
              types: [{ description: 'Text', accept: { 'text/plain': ['.txt'] } }]
            });
            const writable = await handle.createWritable();
            await writable.write(text);
            await writable.close();
            state.fileHandle = handle;
            state.fileName = handle.name || state.fileName;
            state.dirty = false;
            applySettings();
            updateStatus();
            return;
          }
          const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = state.fileName;
          a.click();
          URL.revokeObjectURL(url);
          state.dirty = false;
          updateStatus();
        } catch (error) {
          if (isAbortError(error)) return;
          alert('保存できませんでした。保存先とブラウザの権限を確認してください。');
        }
      }

      function getShiftJisEncodeMap() {
        if (shiftJisEncodeMap) return shiftJisEncodeMap;
        const decoder = new TextDecoder('shift_jis', { fatal: true });
        const map = new Map();
        const add = (bytes) => {
          try {
            const decoded = decoder.decode(new Uint8Array(bytes));
            if (!decoded || decoded.includes('\uFFFD')) return;
            if (Array.from(decoded).length !== 1) return;
            if (!map.has(decoded)) map.set(decoded, bytes);
          } catch (_error) {
            // Invalid byte sequence for Shift_JIS.
          }
        };
        for (let byte = 0x00; byte <= 0x7f; byte += 1) add([byte]);
        for (let byte = 0xa1; byte <= 0xdf; byte += 1) add([byte]);
        const leads = [
          ...range(0x81, 0x9f),
          ...range(0xe0, 0xfc)
        ];
        const trails = [
          ...range(0x40, 0x7e),
          ...range(0x80, 0xfc)
        ];
        leads.forEach((lead) => {
          trails.forEach((trail) => add([lead, trail]));
        });
        shiftJisEncodeMap = map;
        return map;
      }

      function range(start, end) {
        return Array.from({ length: end - start + 1 }, (_item, index) => start + index);
      }

      function toCodePointLabel(char) {
        return `U+${char.codePointAt(0).toString(16).toUpperCase().padStart(4, '0')}`;
      }

      function buildShiftJisExportText(text) {
        const map = getShiftJisEncodeMap();
        const replacementChar = map.has('■') ? '■' : '?';
        const replacements = new Map();
        let converted = '';
        Array.from(text).forEach((char) => {
          if (map.has(char)) {
            converted += char;
            return;
          }
          const label = toCodePointLabel(char);
          replacements.set(label, (replacements.get(label) || 0) + 1);
          converted += replacementChar;
        });
        if (!replacements.size) return converted;
        const lines = [
          '',
          '',
          '---- S_JIS書き出し時の置換文字一覧 ----',
          `S_JISで表現できない文字を「${replacementChar}」に置換しました。`,
          '元の文字はUnicode番号で記録しています。',
          ...Array.from(replacements.entries()).map(([label, count]) => `${label} : ${count}箇所`)
        ];
        return converted + lines.join('\n');
      }

      function encodeShiftJis(text) {
        const map = getShiftJisEncodeMap();
        const bytes = [];
        Array.from(text).forEach((char) => {
          const encoded = map.get(char) || map.get('■') || map.get('?');
          bytes.push(...encoded);
        });
        return new Uint8Array(bytes);
      }

      async function saveShiftJisDocument() {
        if (!window.TextDecoder) {
          alert('このブラウザではS_JIS変換に対応できません。');
          return;
        }
        let exportText;
        let bytes;
        try {
          exportText = buildShiftJisExportText(getText());
          bytes = encodeShiftJis(exportText);
        } catch (_error) {
          alert('このブラウザではS_JIS変換に対応できません。');
          return;
        }
        try {
          const suggestedName = state.fileName.replace(/\.[^.]*$/, '') + '_sjis.txt';
          if (window.showSaveFilePicker) {
            const handle = await window.showSaveFilePicker({
              suggestedName,
              types: [{ description: 'Shift_JIS Text', accept: { 'text/plain': ['.txt'] } }]
            });
            const writable = await handle.createWritable();
            await writable.write(bytes);
            await writable.close();
            return;
          }
          const blob = new Blob([bytes], { type: 'text/plain;charset=shift_jis' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = suggestedName;
          a.click();
          URL.revokeObjectURL(url);
        } catch (error) {
          if (isAbortError(error)) return;
          alert('S_JISファイルを書き出せませんでした。');
        }
      }

      function buildMatcher() {
        if (!searchInput.value) return null;
        if (regexToggle.checked) {
          try {
            return new RegExp(searchInput.value, 'g');
          } catch (_error) {
            alert('正規表現が正しくありません。');
            return null;
          }
        }
        return new RegExp(searchInput.value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
      }

      function getSearchKey() {
        return `${regexToggle.checked ? 'regex' : 'text'}:${searchInput.value}`;
      }

      function recordSearchHistory() {
        const entry = {
          search: searchInput.value,
          replace: replaceInput.value,
          regex: regexToggle.checked
        };
        if (
          entry.search === ''
          || entry.search.length > SEARCH_HISTORY_MAX_FIELD_LENGTH
          || entry.replace.length > SEARCH_HISTORY_MAX_FIELD_LENGTH
        ) return;
        state.searchHistory = sanitizeSearchHistory([entry, ...state.searchHistory]);
        renderSearchHistory();
        saveLocalState();
      }

      function restoreSearchHistory() {
        if (searchHistorySelect.value === '') return;
        const index = Number(searchHistorySelect.value);
        const entry = Number.isInteger(index) ? state.searchHistory[index] : null;
        searchHistorySelect.value = '';
        if (!entry) return;
        searchInput.value = entry.search;
        replaceInput.value = entry.replace;
        regexToggle.checked = entry.regex;
        lastSearchMatch = null;
        searchInput.focus();
      }

      function clearSearchHistory() {
        if (!state.searchHistory.length) return;
        if (!confirm('検索履歴を消去しますか？')) return;
        state.searchHistory = [];
        renderSearchHistory();
        saveLocalState();
      }

      function nextTextIndex(text, index) {
        if (index >= text.length) return text.length + 1;
        return index + (text.codePointAt(index) > 0xffff ? 2 : 1);
      }

      function getNextMatch(matcher, text, startAt) {
        matcher.lastIndex = Math.min(startAt, text.length);
        let match = startAt <= text.length ? matcher.exec(text) : null;
        if (!match && startAt > 0) {
          matcher.lastIndex = 0;
          match = matcher.exec(text);
        }
        return match;
      }

      function expandRegexReplacement(template, match, text) {
        return template.replace(/\$(\$|&|`|'|<[^>]+>|\d{1,2})/g, (whole, token) => {
          if (token === '$') return '$';
          if (token === '&') return match[0];
          if (token === '`') return text.slice(0, match.index);
          if (token === "'") return text.slice(match.index + match[0].length);
          if (token.startsWith('<')) {
            if (!match.groups) return whole;
            return match.groups[token.slice(1, -1)] || '';
          }
          let captureIndex = Number(token);
          if (captureIndex > 0 && captureIndex < match.length) return match[captureIndex] || '';
          if (token.length === 2) {
            captureIndex = Number(token[0]);
            if (captureIndex > 0 && captureIndex < match.length) {
              return (match[captureIndex] || '') + token[1];
            }
          }
          return whole;
        });
      }

      function commitProgrammaticEdit() {
        lastSearchMatch = null;
        markDirty();
        renderLineRuler();
        renderOutline();
        pushHistory();
      }

      function replaceAll() {
        const matcher = buildMatcher();
        if (!matcher) return;
        if (replaceInput.value === '' && !confirm('置換欄が空です。一致箇所を削除しますか？')) return;
        recordSearchHistory();
        const text = getText();
        const replaced = text.replace(matcher, replaceInput.value);
        if (replaced === text) return;
        setText(replaced);
        commitProgrammaticEdit();
      }

      function findNext() {
        const matcher = buildMatcher();
        if (!matcher) return;
        recordSearchHistory();
        const text = getText();
        const key = getSearchKey();
        let startAt = editor.selectionEnd || 0;
        if (
          lastSearchMatch
          && lastSearchMatch.key === key
          && editor.selectionStart === lastSearchMatch.start
          && editor.selectionEnd === lastSearchMatch.end
        ) {
          startAt = lastSearchMatch.start === lastSearchMatch.end
            ? nextTextIndex(text, lastSearchMatch.end)
            : lastSearchMatch.end;
        }
        const match = getNextMatch(matcher, text, startAt);
        if (!match) return;
        if (
          lastSearchMatch
          && lastSearchMatch.key === key
          && match.index === lastSearchMatch.start
          && match.index + match[0].length === lastSearchMatch.end
        ) return;
        editor.focus();
        editor.setSelectionRange(match.index, match.index + match[0].length);
        lastSearchMatch = {
          key,
          start: match.index,
          end: match.index + match[0].length
        };
        renderLineRuler();
      }

      function replaceNext() {
        const matcher = buildMatcher();
        if (!matcher) return;
        recordSearchHistory();
        const text = getText();
        const key = getSearchKey();
        const selectionStart = editor.selectionStart || 0;
        const selectionEnd = editor.selectionEnd || 0;
        matcher.lastIndex = selectionStart;
        let match = matcher.exec(text);
        const selectionIsMatch = match
          && match.index === selectionStart
          && match.index + match[0].length === selectionEnd;
        const selectionIsLastSearch = lastSearchMatch
          && lastSearchMatch.key === key
          && lastSearchMatch.start === selectionStart
          && lastSearchMatch.end === selectionEnd;
        if (!selectionIsMatch || (selectionStart === selectionEnd && !selectionIsLastSearch)) {
          match = getNextMatch(matcher, text, selectionEnd);
        }
        if (!match) return;
        const before = text.slice(0, match.index);
        const source = match[0];
        const after = text.slice(match.index + source.length);
        const replacement = regexToggle.checked
          ? expandRegexReplacement(replaceInput.value, match, text)
          : replaceInput.value;
        if (source === '' && replacement === '') {
          lastSearchMatch = {
            key,
            start: match.index,
            end: match.index
          };
          findNext();
          return;
        }
        setText(before + replacement + after);
        const caret = before.length + replacement.length;
        editor.focus();
        editor.setSelectionRange(caret, caret);
        if (source === replacement) {
          lastSearchMatch = { key, start: match.index, end: caret };
          renderLineRuler();
          return;
        }
        commitProgrammaticEdit();
      }

      function toggleHeading() {
        const text = getText();
        const caret = editor.selectionStart || 0;
        const lineStart = text.lastIndexOf('\n', Math.max(0, caret - 1)) + 1;
        const lineEndIndex = text.indexOf('\n', caret);
        const lineEnd = lineEndIndex === -1 ? text.length : lineEndIndex;
        const line = text.slice(lineStart, lineEnd);
        const nextLine = line.match(/^#{1,3}\s+/)
          ? line.replace(/^#{1,3}\s+/, '# ')
          : `# ${line}`;
        setText(text.slice(0, lineStart) + nextLine + text.slice(lineEnd));
        const nextCaret = Math.min(lineStart + nextLine.length, caret + (nextLine.length - line.length));
        editor.focus();
        editor.setSelectionRange(nextCaret, nextCaret);
        commitProgrammaticEdit();
      }

      function previousGraphemeIndex(text, index) {
        if (index <= 0) return 0;
        if (graphemeSegmenter) {
          const segments = graphemeSegmenter.segment(text);
          let segment = typeof segments.containing === 'function'
            ? segments.containing(index - 1)
            : null;
          if (!segment) {
            for (const candidate of segments) {
              if (index - 1 >= candidate.index && index - 1 < candidate.index + candidate.segment.length) {
                segment = candidate;
                break;
              }
            }
          }
          if (segment) return segment.index;
        }
        let previous = index - 1;
        if (
          previous > 0
          && text.charCodeAt(previous) >= 0xdc00
          && text.charCodeAt(previous) <= 0xdfff
          && text.charCodeAt(previous - 1) >= 0xd800
          && text.charCodeAt(previous - 1) <= 0xdbff
        ) {
          previous -= 1;
        }
        return previous;
      }

      function nextGraphemeIndex(text, index) {
        if (index >= text.length) return text.length;
        if (graphemeSegmenter) {
          const segments = graphemeSegmenter.segment(text);
          let segment = typeof segments.containing === 'function'
            ? segments.containing(index)
            : null;
          if (!segment) {
            for (const candidate of segments) {
              if (index >= candidate.index && index < candidate.index + candidate.segment.length) {
                segment = candidate;
                break;
              }
            }
          }
          if (segment) return segment.index + segment.segment.length;
        }
        return Math.min(
          text.length,
          index + (text.codePointAt(index) > 0xffff ? 2 : 1)
        );
      }

      function moveCaretByCharacter(event) {
        if (
          (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight')
          || event.altKey
          || event.ctrlKey
          || event.metaKey
          || event.isComposing
          || editorIsComposing
        ) {
          return;
        }

        event.preventDefault();
        const text = editor.value;
        const direction = event.key === 'ArrowLeft' ? -1 : 1;
        const start = editor.selectionStart || 0;
        const end = editor.selectionEnd || 0;

        if (!event.shiftKey) {
          const caret = start !== end
            ? (direction < 0 ? start : end)
            : (direction < 0
              ? previousGraphemeIndex(text, start)
              : nextGraphemeIndex(text, end));
          editor.setSelectionRange(caret, caret, 'none');
          renderLineRuler();
          return;
        }

        const selectionDirection = editor.selectionDirection;
        const anchor = selectionDirection === 'backward' ? end : start;
        const focus = selectionDirection === 'backward' ? start : end;
        const nextFocus = direction < 0
          ? previousGraphemeIndex(text, focus)
          : nextGraphemeIndex(text, focus);
        const nextStart = Math.min(anchor, nextFocus);
        const nextEnd = Math.max(anchor, nextFocus);
        const nextDirection = nextFocus < anchor
          ? 'backward'
          : (nextFocus > anchor ? 'forward' : 'none');
        editor.setSelectionRange(nextStart, nextEnd, nextDirection);
        renderLineRuler();
      }

      function handleShortcuts(event) {
        if (event.key === 'Escape' && preview.classList.contains('is-open')) {
          event.preventDefault();
          closePreview();
          return;
        }
        if (event.key === 'Escape' && document.body.classList.contains('settings-open')) {
          event.preventDefault();
          setMobileSettingsOpen(false, true);
          return;
        }
        const modifier = event.metaKey || event.ctrlKey;
        if (!modifier) return;
        const key = event.key.toLowerCase();
        if (key === 'z') {
          if (document.activeElement !== editor) return;
          event.preventDefault();
          if (event.shiftKey) redoEdit();
          else undoEdit();
          return;
        }
        if (key === 's') {
          event.preventDefault();
          saveDocument(event.shiftKey);
          return;
        }
        if (key === 'f') {
          event.preventDefault();
          searchInput.focus();
          searchInput.select();
          return;
        }
        if (key === 'p') {
          event.preventDefault();
          renderPreview();
          return;
        }
        if (key === 'g') {
          event.preventDefault();
          replaceNext();
          return;
        }
        if (key === 't') {
          event.preventDefault();
          toggleHeading();
        }
      }

      document.getElementById('previewButton').addEventListener('click', renderPreview);
      document.getElementById('closePreviewButton').addEventListener('click', closePreview);
      mobileSettingsButton.addEventListener('click', () => {
        setMobileSettingsOpen(!document.body.classList.contains('settings-open'));
      });
      mobileDrawerCloseButton.addEventListener('click', () => setMobileSettingsOpen(false, true));
      mobileScrim.addEventListener('click', () => setMobileSettingsOpen(false, true));
      mobilePreviewButton.addEventListener('click', renderPreview);
      document.getElementById('newButton').addEventListener('click', () => {
        if (state.dirty && !confirm('未保存の変更があります。新規原稿にしますか？')) return;
        state.fileName = 'bunko-notepad.txt';
        state.fileHandle = null;
        setText('');
        state.dirty = false;
        resetHistory();
        applySettings();
        updateStatus();
      });
      document.getElementById('openButton').addEventListener('click', openDocument);
      document.getElementById('saveButton').addEventListener('click', () => saveDocument(false));
      document.getElementById('saveAsButton').addEventListener('click', () => saveDocument(true));
      document.getElementById('saveSjisButton').addEventListener('click', saveShiftJisDocument);
      document.getElementById('findNextButton').addEventListener('click', findNext);
      document.getElementById('replaceAllButton').addEventListener('click', replaceAll);
      document.getElementById('replaceNextButton').addEventListener('click', replaceNext);
      searchHistorySelect.addEventListener('change', restoreSearchHistory);
      clearSearchHistoryButton.addEventListener('click', clearSearchHistory);
      document.addEventListener('keydown', handleShortcuts);
      editor.addEventListener('compositionstart', () => { editorIsComposing = true; });
      editor.addEventListener('compositionend', () => { editorIsComposing = false; });
      editor.addEventListener('keydown', moveCaretByCharacter);
      editor.addEventListener('input', () => {
        lastSearchMatch = null;
        markDirty();
        renderLineRuler();
        renderOutline();
        pushHistory();
      });
      ['click', 'keyup', 'select', 'scroll'].forEach((eventName) => {
        editor.addEventListener(eventName, renderLineRuler);
      });
      document.addEventListener('selectionchange', () => {
        if (document.activeElement === editor) renderLineRuler();
      });
      window.addEventListener('resize', handleViewportResize);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', handleViewportResize);
      }
      if (mobileLayoutQuery.addEventListener) {
        mobileLayoutQuery.addEventListener('change', syncMobileLayoutState);
      } else {
        mobileLayoutQuery.addListener(syncMobileLayoutState);
      }
      fileNameInput.addEventListener('change', () => {
        const nextName = fileNameInput.value.trim() || state.fileName;
        if (state.fileHandle && nextName !== state.fileHandle.name) state.fileHandle = null;
        state.fileName = nextName;
        applySettings();
        updateStatus();
      });
      searchInput.addEventListener('input', () => { lastSearchMatch = null; });
      regexToggle.addEventListener('change', () => { lastSearchMatch = null; });
      charsSelect.addEventListener('change', () => {
        state.chars = Number(charsSelect.value);
        applySettings();
        updateStatus();
      });
      linesSelect.addEventListener('change', () => {
        state.lines = Number(linesSelect.value);
        applySettings();
        updateStatus();
      });
      lineNumberToggle.addEventListener('change', () => {
        state.showLineNumbers = lineNumberToggle.checked;
        applySettings();
        updateStatus();
      });
      pageBreakToggle.addEventListener('change', () => {
        state.showPageBreak = pageBreakToggle.checked;
        applySettings();
        updateStatus();
      });
      gridToggle.addEventListener('change', () => {
        state.showGrid = gridToggle.checked;
        applySettings();
        updateStatus();
      });
      fileInput.addEventListener('change', async event => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        try {
          setText(await readTextFile(file));
          state.fileName = file.name || state.fileName;
          state.fileHandle = null;
          state.dirty = false;
          lastSearchMatch = null;
          resetHistory();
          applySettings();
          updateStatus();
          renderOutline();
        } catch (_error) {
          alert('このテキストファイルを読み込めませんでした。');
        } finally {
          fileInput.value = '';
        }
      });

      window.addEventListener('beforeunload', (event) => {
        if (!state.dirty) return;
        event.preventDefault();
        event.returnValue = '';
      });

      let saved = null;
      try {
        saved = localStorage.getItem(STORAGE_KEY);
      } catch (_error) {
        autosaveFailed = true;
      }
      if (saved) {
        try {
          const data = JSON.parse(saved);
          setText(typeof data.text === 'string' ? data.text : sampleText);
          state.fileName = data.fileName || state.fileName;
          state.chars = [39, 40, 41].includes(Number(data.chars)) ? Number(data.chars) : 40;
          state.lines = [15, 16].includes(Number(data.lines)) ? Number(data.lines) : 15;
          state.showLineNumbers = data.showLineNumbers !== false;
          state.showPageBreak = data.showPageBreak !== false;
          state.showGrid = data.showGrid !== false;
          state.searchHistory = sanitizeSearchHistory(data.searchHistory);
        } catch (_error) {
          setText(sampleText);
        }
      } else {
        setText(sampleText);
      }
      renderSearchHistory();
      syncViewportHeight();
      syncMobileLayoutState();
      updateStatus();
      renderOutline();
      resetHistory();
      editor.focus();
    })();
  </script>
</body>
</html>
